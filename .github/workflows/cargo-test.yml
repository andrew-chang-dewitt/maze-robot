name: Cargo Test

on:
  push:
    branches:
      - main
      - swarm/main
  pull_request:
    branches:
      - main
      - swarm/main

jobs:
  test:
    name: Run cargo test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test
